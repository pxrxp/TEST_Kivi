name: Build Skyline Geolocation APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Buildozer inside Docker (prebuilt Kivy tooling)
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: --user 1000:1000 -v ${{ github.workspace }}:/home/user/app -w /home/user/app
        run: |
          set -eux
          pip install --upgrade pip
          # optional: add build-time python deps here, e.g. pip install cython
          buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: skyline-geolocation-apk
        path: bin/*.apk
        if-no-files-found: ignore
