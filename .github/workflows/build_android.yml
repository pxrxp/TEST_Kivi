name: Build Skyline Geolocation APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Run Buildozer inside Docker (prebuilt Kivy tooling)
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        # run as root inside container so venv and installs succeed; we'll chown back to runner UID after
        options: -v ${{ github.workspace }}:/home/user/app -w /home/user/app
        run: |
          set -eux
          # create venv inside repo (root can write)
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install buildozer python-Levenshtein
          # run build
          buildozer -v android debug
          # make files writable by runner (uid 1000) so upload works
          chown -R 1000:1000 /home/user/app || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: skyline-geolocation-apk
        path: bin/*.apk
        if-no-files-found: ignore
