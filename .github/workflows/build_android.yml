name: Build Skyline Geolocation APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Run Buildozer inside Docker (prebuilt Kivy tooling)
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: --user 1000:1000 -v ${{ github.workspace }}:/home/user/app -w /home/user/app
        run: |
          set -eux
          # create venv inside repo so pip upgrade writable
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install buildozer python-Levenshtein
          # optional: add build-time deps here, e.g. pip install cython==0.29.35
          buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: skyline-geolocation-apk
        path: bin/*.apk
        if-no-files-found: ignore
