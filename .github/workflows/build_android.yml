name: Build Skyline Geolocation APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Run Buildozer inside Docker (prebuilt Kivy tooling)
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        python_version: 3.12
        options: -v ${{ github.workspace }}:/home/user/app -w /home/user/app
        run: |
          set -eux
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel cython
          pip install buildozer python-Levenshtein
          
          # Pre-install dependencies using pre-built wheels
          # This bypasses git checkout errors and Python 3.14 compatibility issues
          pip install numpy==1.24.3 opencv-python==4.8.1.78 plyer onnxruntime
          
          # pipe "yes" so buildozer won't block on root confirmation
          yes | BUILDOZER_ALLOW_ROOT=1 buildozer --allow-root -v android debug
          # make files readable by runner user
          chown -R 1000:1000 /home/user/app || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: skyline-geolocation-apk
        path: bin/*.apk
        if-no-files-found: ignore
