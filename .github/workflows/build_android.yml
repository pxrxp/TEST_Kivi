name: Build Skyline Geolocation APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Buildozer inside Docker (prebuilt Kivy tooling)
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        # mount the workspace into the container and run as the current user to avoid permission issues
        options: --user 1000:1000 -v ${{ github.workspace }}:/home/user/app -w /home/user/app
        run: |
          set -eux
          # Make sure pip inside container is recent and install any python deps your buildozer.spec needs
          pip install --upgrade pip
          # Optional: install additional Python packages needed at build-time (example)
          # pip install cython==0.29.35
          # Run the build
          buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: skyline-geolocation-apk
        path: bin/*.apk
